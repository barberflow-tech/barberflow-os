services:
  # La base de datos ya no vive aqui: es el stack local de Supabase
  # (Postgres + Realtime), que se levanta aparte con `supabase start`.
  # El backend lo alcanza en host.docker.internal:54322 (ver .env.example).

  # Servicio API Backend (Django 5)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: barberflow_backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Servicio Frontend (React 19 + Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: barberflow_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      # Realtime contra el Supabase local; los toma del .env de la raiz.
      VITE_SUPABASE_URL: ${SUPABASE_URL:-http://127.0.0.1:54321}
      VITE_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
    depends_on:
      - backend