[tool.black]
line-length = 88
target-version = ["py312"]
extend-exclude = "migrations"

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# E501 (linea larga) la ignora Ruff a proposito: Black ya formatea el largo
# de linea, y lo unico que queda son strings/paths que no se pueden partir.
ignore = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]
# Cobertura minima del 85 % (DoD de SCRUM-32): pytest falla si baja de ahi.
addopts = "--cov=apps --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
omit = ["*/migrations/*"]
