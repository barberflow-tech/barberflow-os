services:
  # Base de Datos PostgreSQL Local (para desarrollo offline)
  postgres_db:
    image: postgres:16-alpine
    container_name: barberflow_db
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Servicio API Backend (Django 5)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: barberflow_backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
    depends_on:
      - postgres_db

  # Servicio Frontend (React 19 + Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: barberflow_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata: