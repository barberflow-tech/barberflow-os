name: Backend CI

on:
  push:
    branches: [develop, main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [develop, main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  lint-and-test:
    name: Lint (Black/Ruff) + Tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: barberadmin
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: barberflow_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: barberadmin
      POSTGRES_PASSWORD: ci-test-password
      POSTGRES_DB: barberflow_db
      DJANGO_SECRET_KEY: ci-test-secret-key
      DJANGO_DEBUG: "False"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Black (formato)
        run: black --check .

      - name: Ruff (lint)
        run: ruff check .

      - name: Django system check
        run: python manage.py check

      - name: Tests (pytest)
        run: python -m pytest -v
