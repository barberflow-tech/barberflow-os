services:
  # La base de datos ya no vive aqui: es el stack local de Supabase
  # (Postgres + Realtime), que se levanta aparte con `supabase start`.
  # El backend lo alcanza en host.docker.internal:54322 (ver .env.example).

  # Servicio API Backend (Django 5)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: barberflow_backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Recordatorios de citas (HU-05): ejecuta `enviar_recordatorios` cada 10 minutos.
  # Es opcional y solo para pruebas locales (no arranca con `docker compose up`):
  #   docker compose --profile recordatorios up -d recordatorios
  # En Staging/produccion lo hace un Cron Job de Render (ver README).
  recordatorios:
    profiles: ["recordatorios"]
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: barberflow_recordatorios
    env_file:
      - .env
    volumes:
      - ./backend:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sh -c "while true; do python manage.py enviar_recordatorios; sleep 600; done"

  # Servicio Frontend (React 19 + Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: barberflow_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      # Realtime contra el Supabase local; los toma del .env de la raiz.
      VITE_SUPABASE_URL: ${SUPABASE_URL:-http://127.0.0.1:54321}
      VITE_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
    depends_on:
      - backend