[tool.black]
line-length = 88
target-version = ["py312"]
extend-exclude = "migrations"

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# E501 (linea larga) la ignora Ruff a proposito: Black ya formatea el largo
# de linea, y lo unico que queda son strings/paths que no se pueden partir.
ignore = ["E501"]
